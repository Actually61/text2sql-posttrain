seed: 42
model_config: configs/model.yaml
prompt_config: configs/prompt.yaml
attention_implementation: sdpa
quantization:
  type: nf4
  compute_dtype: bfloat16
  double_quant: true
generation:
  do_sample: false
  num_beams: 1
  max_new_tokens: 128
  max_time_seconds: 120
  repetition_penalty: 1.0
example:
  id: synthetic_students_001
  schema: |-
    CREATE TABLE students (
        id INTEGER PRIMARY KEY,
        name TEXT NOT NULL,
        major TEXT NOT NULL,
        score INTEGER NOT NULL
    );
  question: >-
    List the names of students whose major is 'CS' and score is at least 90,
    ordered by score from highest to lowest.
  rows:
    - [1, Alice, CS, 95]
    - [2, Bob, Math, 92]
    - [3, Carol, CS, 88]
    - [4, David, CS, 97]
    - [5, Eve, CS, 90]
  gold_sql: >-
    SELECT name FROM students WHERE major = 'CS' AND score >= 90 ORDER BY score DESC;
  expected_rows:
    - [David]
    - [Alice]
    - [Eve]
  query_timeout_seconds: 2
  max_result_rows: 100
